# main 브랜치에 올리면 자동으로 빌드해서 GitHub Pages에 배포합니다.
# 저장소 Settings → Pages → Source를 "GitHub Actions"로 한 번만 설정해 주세요.
name: GitHub Pages 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 패키지 설치
        run: npm ci

      - name: 판정 로직 테스트
        run: npm test

      - name: 빌드 (자세 인식 파일 준비 포함)
        run: npm run build

      - name: 자세 인식 모델 확인
        run: |
          if [ -s dist/models/pose_landmarker_lite.task ]; then
            echo "모델 파일 포함 완료"
          else
            echo "::warning::모델 파일을 받지 못했어요. 앱이 실행될 때 Google 주소에서 직접 불러옵니다."
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
